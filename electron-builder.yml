appId: com.multichat.app
productName: MultiChat
directories:
  output: dist
  buildResources: build

# 原生模块解压配置（monio-napi 等 .node 文件需要从 asar 解压才能加载）
asarUnpack:
  - "**/*.node"

# 应用图标配置
icon: assets/logo.png

files:
  - from: out/main
    to: out/main
  - from: out/preload
    to: out/preload
  - from: out/renderer
    to: out/renderer
  - from: assets
    to: assets
  - package.json
  - "!**/*.map"

extraResources:
  - from: out/cli/index.js
    to: cli/index.js
  # Agent 随包 skill：整目录拷贝，内核扫描挂载（同名 skill 用户目录优先覆盖）。
  # node_modules 已随 prepare-runtime 预装在其中，内核扫描时会跳过 node_modules，无副作用。
  - from: .agents/skills
    to: skill
  # 运行时供给：ensure-python 共享脚本 + node 入口 shim（build/runtime 由 prepare-runtime 生成）
  - from: build/runtime
    to: runtime

# ============ Windows 打包配置 ============
win:
  target:
    # 安装版：不包含 portable.txt 标记文件
    - target: nsis
      arch:
        - x64
    # 便携版 ZIP：包含 portable.txt，需手动解压
    - target: zip
      arch:
        - x64
  extraFiles:
    # CLI 入口 shim：安装版可选把 $INSTDIR\cli 加入 PATH（installer.nsh 复选框控制），便携版可手动调用
    - from: build/cli/multichat.cmd
      to: cli/multichat.cmd

# ============ NSIS 安装包配置 ============
nsis:
  oneClick: false                              # 允许自定义安装路径
  perMachine: false                            # 单用户安装（不需管理员权限）
  allowToChangeInstallationDirectory: true     # 允许用户选择安装目录
  deleteAppDataOnUninstall: false              # 卸载时不默认删除用户数据（由卸载流程勾选控制）
  createDesktopShortcut: true                  # 创建桌面快捷方式（安装时可选择）
  createStartMenuShortcut: true                # 创建开始菜单快捷方式
  shortcutName: MultiChat                 # 快捷方式名称
  displayLanguageSelector: false               # 不显示语言选择
  include: build/installer.nsh

# ============ macOS 打包配置 ============
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: assets/logo.icns
  # 验证期明确不签名；进入正式发布阶段时改为 Developer ID + hardenedRuntime + notarization。
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  extraFiles:
    - from: build/cli/multichat.sh
      to: multichat.sh
    - from: build/MACOS_FIRST_OPEN.md
      to: FIRST_OPEN_ON_MACOS.md

# ============ DMG 配置 ============
dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ============ 便携版配置 ============
# 注意：便携版的标记文件通过 electron-builder-portable.yml 配置添加
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
