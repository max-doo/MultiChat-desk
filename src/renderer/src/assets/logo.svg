<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <radialGradient id="diffuseGrad" cx="150" cy="150" r="700" fx="50" fy="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#FFC8DA" />
      <stop offset="55%" stop-color="#D2E8FF" />
      <stop offset="85%" stop-color="#539CFE" />
      <stop offset="100%" stop-color="#539CFE" />
    </radialGradient>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e40af" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
    <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="6" in="blur" result="offsetBlurTop"/>
      <feComposite in="SourceAlpha" in2="offsetBlurTop" operator="out" result="inverseTop"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.9" result="colorTop"/>
      <feComposite in="colorTop" in2="inverseTop" operator="in" result="highlight"/>
      <feOffset dx="0" dy="-6" in="blur" result="offsetBlurBottom"/>
      <feComposite in="SourceAlpha" in2="offsetBlurBottom" operator="out" result="inverseBottom"/>
      <feFlood flood-color="#004499" flood-opacity="0.12" result="colorBottom"/>
      <feComposite in="colorBottom" in2="inverseBottom" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="highlight"/>
        <feMergeNode in="shadow"/>
      </feMerge>
    </filter>
    <mask id="cutout">
      <rect x="0" y="0" width="770" height="600" fill="white" />
      <path d="M 30,300 C 150,300 200,400 270,400 C 340,400 430,200 500,200 C 570,200 620,300 740,300" fill="none" stroke="black" stroke-width="56" stroke-linecap="round" />
    </mask>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="transparent" />
  <g transform="translate(127, 212)" filter="url(#dropShadow)">
    <g mask="url(#cutout)" filter="url(#bevel)">
      <path d="M 50,80 Q 50,60 70,63 L 240,96 Q 260,100 260,120 L 260,480 Q 260,500 240,503 L 70,537 Q 50,540 50,520 Z" fill="url(#diffuseGrad)" />
      <path d="M 280,120 Q 280,100 300,100 L 470,100 Q 490,100 490,120 L 490,480 Q 490,500 470,500 L 300,500 Q 280,500 280,480 Z" fill="url(#diffuseGrad)" />
      <path d="M 510,120 Q 510,100 530,96 L 700,63 Q 720,60 720,80 L 720,520 Q 720,540 700,537 L 530,503 Q 510,500 510,480 Z" fill="url(#diffuseGrad)" />
    </g>
  </g>
</svg>
